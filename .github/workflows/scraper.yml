name: Daily Scraper

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run scraper
        run: npm run scrape

      # Runs even when scraping fails. The two steps are independent: articles
      # scraped on earlier days may still be sitting unprocessed, and holding
      # them back because today's fetch failed only deepens the backlog. The
      # job still reports failure via the scrape step above.
      - name: Trigger AI processing
        if: ${{ !cancelled() }}
        run: |
          # The function processes a bounded batch per call and reports whether
          # more articles are waiting. Keep calling until it says it's done.
          for i in $(seq 1 10); do
            echo "── Batch $i ──"
            response=$(curl -X POST "$SUPABASE_URL/functions/v1/process-articles" \
              -H "x-cron-secret: $CRON_SECRET" \
              -H "Content-Type: application/json" \
              --silent --show-error --fail)
            echo "$response"

            if [ "$(echo "$response" | jq -r '.remaining')" != "true" ]; then
              echo "All batches processed."
              exit 0
            fi
          done
          echo "Stopped after 10 batches; remaining articles roll over to the next run."
